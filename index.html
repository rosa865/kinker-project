}

.questionCard div:last-child{

}

.option{

  height:50px;              /* width와 동일 */
  border-radius:50%;
  background:#aa6600;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}

/* 선택 효과 */
.option.selected{
  background:white;
  color:black;
  transform:scale(1.1);
}
/* 선택됐을 때 */
.option.selected{
  background:white;
  color:black;
  transform:scale(1.05);
}

.option:first-child{margin-left:0;}
.option:last-child{margin-right:0;}
.option.selected{
  background:white;
  color:black;
  transform:scale(1.1);
}.option:active{
  transform:scale(0.95);
}html{
  scroll-behavior:smooth;
}.logo{
  display:flex;
  justify-content:center;
  align-items:center;
}

.logo img{

}
.scoreBox{
  margin:20px 0;
  padding:15px;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  text-align:left;
  font-size:14px;

<h2 style="text-align:center; font-size:26px; color:#ff0055;">

/* ================= 테스트 시작 ================= */

function startTest(type){
roleType=type;
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("testScreen").classList.remove("hidden");
renderQuestions();
}

function renderQuestions(){
let container=document.getElementById("questions");
container.innerHTML="";
let qNum=1;

sections.forEach(section=>{
questionsData[roleType][section].forEach(text=>{
container.innerHTML+=`
<div class="questionCard">
<div>${qNum}. ${text}</div>
<div class="optionWrap">
  ${[1,2,3,4,5].map(v=>
    `<span class="option" onclick="selectOption(this)">${v}</span>`
  ).join("")}
</div>
</div>`;
qNum++;
});
});
}

function selectOption(el){
let siblings=el.parentNode.querySelectorAll(".option");
siblings.forEach(s=>s.classList.remove("selected"));
el.classList.add("selected");
}

/* ================= 분석 ================= */

function analyze(){
Object.keys(categories).forEach(k=>categories[k]=0);

let cards=document.querySelectorAll(".questionCard");

cards.forEach((card,index)=>{
let selected=card.querySelector(".selected");
if(selected){
let sectionIndex=Math.floor(index/10);
categories[sections[sectionIndex]]+=parseInt(selected.innerText);
}
});



/* ===== STEP 1 : 상위 3요소 조합 정렬 ===== */

let sorted=Object.entries(categories)
  .sort((a,b)=>b[1]-a[1]);

let top3Arr=sorted.slice(0,3)
  .map(x=>x[0])
  .sort(); // 반드시 정렬

let combination=top3Arr.join("+");

let typeName=null;

/* 조합 매칭 */
Object.keys(typeMap).forEach(key=>{
  let keySorted=key.split("+").sort().join("+");
  if(keySorted===combination){
    typeName=typeMap[key][roleType];
  }
});

/* 매칭 실패 시 가장 높은 요소 기준으로 보정 */
if(!typeName){
  let primary=sorted[0][0];

  const fallbackMap={
    통제:{dom:"군주",sub:"시종"},
    고통:{dom:"심판자",sub:"순응자"},
    수치:{dom:"재판관",sub:"속죄자"},
    굴복:{dom:"인형사",sub:"인형"},
    훈육:{dom:"조련사",sub:"애완동물"},
    페티시:{dom:"연출가",sub:"전시물"}
  };

  typeName=fallbackMap[primary][roleType];
}
if(!typeName){
  typeName = sorted[0][0] + "형";
}
let structure=(categories["통제"]+categories["훈육"])/2;
let sensory=(categories["고통"]+categories["페티시"])/2;
let emotional=(categories["수치"]+categories["굴복"])/2;

let conditionText,startText;

if(structure>=sensory && structure>=emotional){
conditionText="역할과 위계가 분명해질 때 성향이 깊어집니다.";
startText="관계의 몰입이 ‘위계와 역할’에서 시작됩니다.";
}else if(sensory>=emotional){
conditionText="신체적 자극이 주어질 때 자연스럽게 몰입합니다.";
startText="관계의 몰입이 ‘신체적 자극’에서 시작됩니다.";
}else{
conditionText="감정적 긴장과 시선 속에서 성향이 살아납니다.";
startText="관계의 몰입이 ‘감정적 긴장’에서 시작됩니다.";
}

let highCount=Object.values(categories).filter(v=>v>=35).length;
let spectrumText=highCount>=3
? "성향 스펙트럼이 넓은 편입니다."
: highCount==2
? "성향의 축이 비교적 뚜렷하게 형성되어 있습니다."
: "특정 조건이 충족될 때 성향이 강하게 발현됩니다.";

let strongMatch=compatibility[typeName]?.strong || [];
let stableMatch=compatibility[typeName]?.stable || [];

let strongText=strongMatch.join(", ");
let stableText=stableMatch.join(", ");

document.getElementById("testScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

document.getElementById("result").innerHTML=`
<h2 style="text-align:center; font-size:24px; margin-bottom:10px;">
${typeName} 유형
</h2>

<h3 style="text-align:center; font-weight:normal; opacity:0.8; margin-top:0;">
${top3Arr.join(" + ")}
</h3>

<div class="chartWrapper">
<canvas id="radarChart"></canvas>
<div class="centerText">${typeName}</div>
</div>
<div class="resultBox">
  <div class="scoreBox">
  <p>통제 : ${categories["통제"]} 점</p>
  <p>고통 : ${categories["고통"]} 점</p>
  <p>수치 : ${categories["수치"]} 점</p>
  <p>굴복 : ${categories["굴복"]} 점</p>
  <p>훈육 : ${categories["훈육"]} 점</p>
  <p>페티시 : ${categories["페티시"]} 점</p>
</div>
<p><strong>${typeName}</strong> 유형 설명</p>
<p style="opacity:0.85;">${typeDescription[typeName] || ""}</p>
<hr>
<p>${spectrumText}</p>
<p>${conditionText}</p>
<p>${startText}</p>
<hr>
<p>제일 잘 맞는 유형은 "<strong>${strongText}</strong>" 입니다.</p>
<p>안정적으로 어울리는 다른 유형은 "<strong>${stableText}</strong>" 입니다.</p>
<button onclick="saveImage()" class="main">
결과 이미지 저장
</button>
</div>
`;

new Chart(document.getElementById("radarChart"),{
type:'radar',
data:{
labels:sections,
datasets:[{
data:Object.values(categories),
backgroundColor:'rgba(200,0,80,0.4)',
borderColor:'#ff0055',
borderWidth:2
}]
},
options:{
scales:{r:{min:0,max:50,ticks:{display:false},pointLabels:{color:"white"},grid:{color:"#444"}}},
plugins:{legend:{display:false}}
}
});
}

function goHome(){location.reload();}
function goBack(){
document.getElementById("resultScreen").classList.add("hidden");
document.getElementById("testScreen").classList.add("hidden");
document.getElementById("startScreen").classList.remove("hidden");
}
function saveImage(){

  const target = document.getElementById("resultScreen"); // 여기 변경

  window.scrollTo(0, 0);

  setTimeout(() => {
    html2canvas(target, {
      backgroundColor: "#000",
      scrollY: -window.scrollY,
      useCORS: true,
      scale: 2
    }).then(canvas => {
      const link = document.createElement("a");
      link.download = "kinker_result.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }, 500);
}
}

.option{

  background:white;
  color:black;

}
/* 선택됐을 때 */
.option.selected{
  background:white;
  color:black;

.option.selected{

  },

  },

    stable:["군주","연구자"]
  },

    strong:["인형사"],
    stable:["군주","연출가"]
  },

    strong:["심판자"],
    stable:["군주","재판관"]
  },

  },

    strong:["조련사"],

  },

};
const typeDescription = {

  교관: "통제와 훈육을 중심으로 관계를 이끄는 유형입니다. 구조와 규칙 안에서 몰입이 깊어집니다.",
  군주: "위계와 질서를 통해 관계를 설계하는 유형입니다. 권위가 분명할수록 안정감을 느낍니다.",
  재판관: "통제와 수치를 활용해 긴장을 조율하는 유형입니다. 규율 속에서 몰입이 형성됩니다.",
  인형사: "굴복과 통제를 통해 관계를 다루는 유형입니다. 다뤄지는 구조 안에서 만족을 느낍니다.",
  심판자: "고통과 수치를 통해 강한 자극을 추구하는 유형입니다. 감각의 강도가 몰입을 만듭니다.",
  연출가: "장면과 분위기를 설계하는 유형입니다. 시선과 상징 속에서 몰입이 강화됩니다.",
  조련사: "훈육과 반복을 통해 관계를 구축하는 유형입니다. 점진적 길들이기에 만족을 느낍니다.",
  연구자: "자극과 반응을 탐구하는 유형입니다. 경험을 통해 관계를 실험합니다.",

  훈련생: "통제와 훈육 속에서 안정감을 느끼는 유형입니다. 지도와 구조 안에서 몰입합니다.",
  시종: "위계적 관계 안에서 헌신하는 유형입니다. 역할이 분명할수록 편안합니다.",

  인형: "굴복과 의존을 통해 안정감을 찾는 유형입니다. 다뤄질 때 편안함을 느낍니다.",

  애완동물: "훈육과 보호 속에서 안정감을 느끼는 유형입니다. 관계의 소속감이 중요합니다.",

/* ================= 테스트 시작 ================= */

function startTest(type){
roleType=type;
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("testScreen").classList.remove("hidden");
renderQuestions();
}

function renderQuestions(){
let container=document.getElementById("questions");
container.innerHTML="";
let qNum=1;

sections.forEach(section=>{
questionsData[roleType][section].forEach(text=>{
container.innerHTML+=`
<div class="questionCard">
<div>${qNum}. ${text}</div>
<div class="optionWrap">
${[
  "매우<br>아니다",
  "아니다",
  "보통",
  "그렇다",
  "매우<br>그렇다"
].map((label,i)=>
  `<span class="option" data-value="${i+1}" onclick="selectOption(this)">${label}</span>`
).join("")}
</div>
</div>`;
qNum++;
});
});
}

function selectOption(el){
let siblings=el.parentNode.querySelectorAll(".option");
siblings.forEach(s=>s.classList.remove("selected"));
el.classList.add("selected");
}

/* ================= 분석 ================= */

function analyze(){
Object.keys(categories).forEach(k=>categories[k]=0);

let cards=document.querySelectorAll(".questionCard");

cards.forEach((card,index)=>{
let selected=card.querySelector(".selected");
if(selected){
let sectionIndex=Math.floor(index/10);
categories[sections[sectionIndex]]+=parseInt(selected.dataset.value);
}
});



/* ===== 상대점수 기반 유형 계산 ===== */

// 1️⃣ 평균 계산
let values = Object.values(categories);
let mean = values.reduce((a,b)=>a+b,0) / values.length;

// 2️⃣ relative 계산
let relative = {};
Object.keys(categories).forEach(key=>{
  relative[key] = categories[key] - mean;
});

// 3️⃣ 1차 분기
let domBase = relative["통제"] + relative["훈육"];
let fetishBase = relative["페티시"] + relative["고통"];

let typeScores = {};

if(domBase >= fetishBase){

  if(roleType==="dom"){
    typeScores["교관"] = relative["통제"] + relative["고통"] + relative["훈육"];
    typeScores["군주"] = relative["통제"] + relative["수치"] + relative["훈육"];
    typeScores["재판관"] = relative["통제"] + relative["수치"] + relative["고통"];
    typeScores["인형사"] = relative["통제"] + relative["굴복"] + relative["훈육"];
  }else{
    typeScores["훈련생"] = relative["통제"] + relative["고통"] + relative["훈육"];
    typeScores["시종"] = relative["통제"] + relative["수치"] + relative["훈육"];
    typeScores["속죄자"] = relative["통제"] + relative["수치"] + relative["고통"];
    typeScores["인형"] = relative["통제"] + relative["굴복"] + relative["훈육"];
  }

}else{

  if(roleType==="dom"){
    typeScores["심판자"] = relative["고통"] + relative["수치"] + relative["페티시"];
    typeScores["연출가"] = relative["수치"] + relative["굴복"] + relative["페티시"];
    typeScores["조련사"] = relative["굴복"] + relative["훈육"] + relative["페티시"];
    typeScores["연구자"] = relative["고통"] + relative["훈육"] + relative["페티시"];
  }else{
    typeScores["순응자"] = relative["고통"] + relative["수치"] + relative["페티시"];
    typeScores["전시물"] = relative["수치"] + relative["굴복"] + relative["페티시"];
    typeScores["애완동물"] = relative["굴복"] + relative["훈육"] + relative["페티시"];
    typeScores["실험체"] = relative["고통"] + relative["훈육"] + relative["페티시"];
  }
}

let typeName = Object.entries(typeScores)
  .sort((a,b)=>b[1]-a[1])[0][0];
let structure=(categories["통제"]+categories["훈육"])/2;
let sensory=(categories["고통"]+categories["페티시"])/2;
let emotional=(categories["수치"]+categories["굴복"])/2;

let conditionText,startText;

if(structure>=sensory && structure>=emotional){
conditionText="역할과 위계가 분명해질 때 성향이 깊어집니다.";
startText="관계의 몰입이 ‘위계와 역할’에서 시작됩니다.";
}else if(sensory>=emotional){
conditionText="신체적 자극이 주어질 때 자연스럽게 몰입합니다.";
startText="관계의 몰입이 ‘신체적 자극’에서 시작됩니다.";
}else{
conditionText="감정적 긴장과 시선 속에서 성향이 살아납니다.";
startText="관계의 몰입이 ‘감정적 긴장’에서 시작됩니다.";
}

let highCount=Object.values(categories).filter(v=>v>=35).length;
let spectrumText=highCount>=3
? "성향 스펙트럼이 넓은 편입니다."
: highCount==2
? "성향의 축이 비교적 뚜렷하게 형성되어 있습니다."
: "특정 조건이 충족될 때 성향이 강하게 발현됩니다.";

let strongMatch=compatibility[typeName]?.strong || [];
let stableMatch=compatibility[typeName]?.stable || [];

let strongText=strongMatch.join(", ");
let stableText=stableMatch.join(", ");

document.getElementById("testScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

document.getElementById("result").innerHTML=`
<h2 style="text-align:center; font-size:24px; margin-bottom:10px;">
${typeName} 유형
</h2>

<h3 style="text-align:center; font-weight:normal; opacity:0.8; margin-top:0;">
${Object.entries(categories)
   .sort((a,b)=>b[1]-a[1])
   .slice(0,3)
   .map(x=>x[0])
   .join(" + ")}
</h3>

<div class="chartWrapper">
<canvas id="radarChart"></canvas>
<div class="centerText">${typeName}</div>
</div>
<div class="resultBox">
  <div class="scoreBox">
  <p>통제 : ${categories["통제"]} 점</p>
  <p>고통 : ${categories["고통"]} 점</p>
  <p>수치 : ${categories["수치"]} 점</p>
  <p>굴복 : ${categories["굴복"]} 점</p>
  <p>훈육 : ${categories["훈육"]} 점</p>
  <p>페티시 : ${categories["페티시"]} 점</p>
</div>
<p><strong>${typeName}</strong> 유형 설명</p>
<p style="opacity:0.85;">${typeDescription[typeName] || ""}</p>
<hr>
<p>${spectrumText}</p>
<p>${conditionText}</p>
<p>${startText}</p>
<hr>
<p>제일 잘 맞는 유형은 "<strong>${strongText}</strong>" 입니다.</p>
<p>안정적으로 어울리는 다른 유형은 "<strong>${stableText}</strong>" 입니다.</p>
</div>
`;
if(myChart){
  myChart.destroy();
}
myChart = new Chart(document.getElementById("radarChart"),{
type:'radar',
data:{
labels:sections,
datasets:[{
data:Object.values(categories),
backgroundColor:'rgba(200,0,80,0.4)',
borderColor:'#ff0055',
borderWidth:2
}]
},
options:{
scales:{r:{min:0,max:50,ticks:{display:false},pointLabels:{color:"white"},grid:{color:"#444"}}},
plugins:{legend:{display:false}}
}
});
}

function goHome(){location.reload();}
function goBack(){
document.getElementById("resultScreen").classList.add("hidden");
document.getElementById("testScreen").classList.add("hidden");
document.getElementById("startScreen").classList.remove("hidden");
}

</script>
